# Hermes configuration for the Pi 5. Secrets are injected from the private .env.
providers:
  ai-gateway:
    api: https://ai.bchbenjamin.in/codex/v1
    key_env: AI_GATEWAY_API_KEY
    transport: chat_completions
    default_model: ai-gateway

model:
  default: ai-gateway
  provider: custom:ai-gateway
  reasoning_effort: low

gateway:
  api_server:
    max_concurrent_runs: 2
    history_tool_output_max_chars: 20000

mcp_servers:
  simular_box:
    url: https://mcp.box.simular.ai/mcp
    headers:
      Authorization: "Bearer ${MCP_BOX_API_KEY}"
    trust: untrusted
    timeout: 300
    connect_timeout: 60
  beeper:
    url: http://127.0.0.1:23373/v0/mcp
    auth: oauth
    trust: untrusted
    timeout: 120
    connect_timeout: 15
  personal_ai:
    url: http://127.0.0.1:8765/mcp
    headers:
      Authorization: "Bearer ${PAI_API_TOKEN}"
    trust: untrusted
    timeout: 300
    connect_timeout: 20
  # Upstream local stdio MCP. Keep it local; never expose as an unauthenticated HTTP service.
  computer-use-linux:
    command: computer-use-linux
    args: ["mcp"]
    trust: untrusted
    timeout: 120
    connect_timeout: 30

# Preserve the existing Hermes native Wayland desktop-control backend.
# Review tool discovery after enabling the upstream MCP to avoid duplicate controls.
computer_use:
  native_wayland: true
