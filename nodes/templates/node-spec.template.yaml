# Generic Node Specification Template
node_id: "node_template"
hostname: "node-hostname"
tier: "worker" # worker | edge | sandbox | cloud_control_plane

hardware:
  model: "Generic x86_64 / ARM64"
  architecture: "aarch64"
  ram_total_mb: 2048

os:
  distribution: "Debian / Ubuntu / Linux"
  primary_user: "username"

services:
  systemd_system: []
  systemd_user: []

network:
  tailscale_enabled: true
